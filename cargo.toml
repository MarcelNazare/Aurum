[package]
name = "aurum"
version = "0.1.0"
edition = "2021"

[lib]
name = "aurum"
path = "src/lib.rs"

[[bin]]
name = "aurum-gui"
path = "src/bin/aurum-gui.rs"

[[bin]]
name = "aurum-web"
path = "src/bin/aurum-web.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dotenvy = "0.15"
axum = "0.7"
webbrowser = "1"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"