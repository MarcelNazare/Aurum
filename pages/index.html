<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURUM · XAU/USD ICT Scanner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
  :root{--bg:#0b0d10;--bg-soft:#14171c;--border:#1f242b;--text:#e5e7eb;--dim:#6b7280;
        --green:#22c55e;--red:#ef4444;--gold:#d4af37;--cyan:#22d3ee;--magenta:#d946ef;--amber:#eab308}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
  header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:20px;color:var(--gold);letter-spacing:.15em;font-weight:700}
  .subtitle{color:var(--dim);font-size:13px}
  .badge{margin-left:auto;padding:3px 8px;border:1px solid var(--border);border-radius:3px;font-size:10px;color:var(--green)}
  .config{padding:16px 24px;border-bottom:1px solid var(--border);display:grid;gap:12px}
  .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  input,select{padding:8px 10px;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);border-radius:4px;font-family:inherit;font-size:13px;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{padding:9px 18px;background:var(--gold);color:var(--bg);border:none;border-radius:4px;font-family:inherit;font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.04em;transition:opacity .15s}
  button:hover:not(:disabled){opacity:.85}
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{padding:10px 24px;font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .status.info{color:var(--cyan)}.status.error{color:var(--red)}.status.success{color:var(--green)}
  .hidden{display:none!important}
  .spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bias{padding:12px 24px;font-size:14px;border-bottom:1px solid var(--border);background:var(--bg-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bias.bull strong{color:var(--green)}.bias.bear strong{color:var(--red)}
  .bias .as-of{margin-left:auto;color:var(--dim);font-size:11px}
  .chart-wrap{padding:16px 24px 0}
  #chart{display:block;width:100%;height:500px;border-radius:6px;background:#0b0d10}
  .legend{padding:10px 24px 16px;font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:14px}
  .legend span{white-space:nowrap}.legend span::before{content:'■';margin-right:4px;font-size:12px}
  .legend .bos::before{content:'▲';color:var(--amber)}
  .legend .choch::before{content:'◆';color:var(--amber)}
  .legend .mss::before{content:'✦';color:var(--magenta)}
  .legend .sweep::before{content:'○';color:var(--cyan)}
  .legend .ifvg::before{content:'◆';color:var(--magenta)}
  .legend .fvg::before{content:'░';color:#3b82f6}
  .legend .supply::before{color:var(--red)}.legend .demand::before{color:var(--green)}
  .legend .entry::before{content:'─';color:var(--green)}
  .legend .stop::before{content:'─';color:var(--red)}
  .legend .tp::before{content:'─';color:var(--amber)}
  .signals{padding:20px 24px 40px;border-top:1px solid var(--border)}
  .signals h2{margin:0 0 12px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .empty-state{padding:24px;text-align:center;color:var(--dim);border:1px dashed var(--border);border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
  th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
  thead th{background:var(--bg-soft);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  tbody td.side.bull{color:var(--green);font-weight:700}
  tbody td.side.bear{color:var(--red);font-weight:700}
  tbody td.score{font-weight:700}
  tbody td.score.s9plus{color:var(--gold)}
  .reasons-row td{border-bottom:1px solid var(--border);padding-top:0;padding-bottom:8px;text-align:left}
  .pill{display:inline-block;padding:1px 6px;margin-right:4px;background:var(--bg-soft);border-radius:3px;font-size:10px;color:var(--dim)}
  footer{padding:16px 24px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);text-align:center}
</style>
</head>
<body>

<header>
  <h1>AURUM</h1>
  <span class="subtitle">XAU/USD · ICT Scanner</span>
  <span class="badge">● server mode</span>
</header>

<section class="config">
  <div class="field-row">
    <div class="field">
      <label for="interval">Interval</label>
      <select id="interval">
        <option>1min</option><option>5min</option>
        <option selected>15min</option><option>30min</option>
        <option>1h</option><option>4h</option><option>1day</option>
      </select>
    </div>
    <div class="field"><label for="outputsize">Bars</label><input type="number" id="outputsize" value="500" min="100" max="5000"></div>
    <div class="field"><label for="window">Window</label><input type="number" id="window" value="100" min="20" max="300"></div>
    <div class="field"><label for="htfRatio">HTF Ratio</label><input type="number" id="htfRatio" value="5" min="2" max="50"></div>
    <div class="field"><label for="minScore">Min Score</label><input type="number" id="minScore" value="6" min="0" max="12"></div>
  </div>
  <div class="actions"><button id="fetchBtn" type="button">Fetch &amp; Analyze</button></div>
</section>

<div id="status" class="status hidden"></div>
<section id="biasBar" class="bias hidden"></section>
<section class="chart-wrap"><canvas id="chart"></canvas></section>
<section class="legend">
  <span class="bos">BOS</span><span class="choch">ChoCh</span><span class="mss">MSS</span>
  <span class="sweep">Sweep</span><span class="ifvg">IFVG</span><span class="fvg">FVG</span>
  <span class="supply">Supply</span><span class="demand">Demand</span>
  <span class="entry">Entry</span><span class="stop">Stop</span><span class="tp">TP1/2/3</span>
</section>
<section class="signals">
  <h2>Signals</h2>
  <div id="signalsWrap"><div class="empty-state">Click <strong>Fetch &amp; Analyze</strong> to run the scanner.</div></div>
</section>
<footer>AURUM · analysis runs on the local Rust server · no financial advice</footer>

<script>
const els = {
  interval:   document.getElementById('interval'),
  outputsize: document.getElementById('outputsize'),
  window:     document.getElementById('window'),
  htfRatio:   document.getElementById('htfRatio'),
  minScore:   document.getElementById('minScore'),
  fetchBtn:   document.getElementById('fetchBtn'),
  status:     document.getElementById('status'),
  biasBar:    document.getElementById('biasBar'),
  chart:      document.getElementById('chart'),
  signalsWrap:document.getElementById('signalsWrap'),
};

function setStatus(msg, type='info', loading=false){
  els.status.innerHTML='';
  if (loading) { const s=document.createElement('span'); s.className='spinner'; els.status.appendChild(s); }
  const t=document.createElement('span'); t.textContent=msg; els.status.appendChild(t);
  els.status.className=`status ${type}`;
  els.status.classList.remove('hidden');
}

function updateBias(b){
  const label = b.direction === 'bull' ? 'LONG' : 'SHORT';
  const detail = (b.kind && b.idx !== null) ? ` · last HTF ${b.kind.toUpperCase()} @ bar ${b.idx}` : '';
  const asOf = `as of ${new Date().toUTCString().replace('GMT','UTC')}`;
  els.biasBar.innerHTML = `BIAS: <strong class="${b.direction}">${label}</strong>${detail}<span class="as-of">${asOf}</span>`;
  els.biasBar.className = `bias ${b.direction}`;
  els.biasBar.classList.remove('hidden');
}

function renderSignals(signals, minScore){
  if (!signals.length){
    els.signalsWrap.innerHTML = `<div class="empty-state">No signals above threshold (${minScore}). Try lowering Min Score or increasing Bars.</div>`;
    return;
  }
  const rows = signals.map((s,i)=>`
    <tr>
      <td>${i+1}</td><td>${s.strategy}</td>
      <td class="side ${s.side}">${s.side==='bull'?'LONG':'SHORT'}</td>
      <td>${s.entry.toFixed(2)}</td><td>${s.stop.toFixed(2)}</td>
      <td>${s.tp1.toFixed(2)}</td><td>${s.tp2.toFixed(2)}</td><td>${s.tp3.toFixed(2)}</td>
      <td class="score${s.score>=9?' s9plus':''}">${s.score}/12</td>
    </tr>
    <tr class="reasons-row"><td colspan="9">${s.reasons.map(r=>`<span class="pill">${r}</span>`).join('')}</td></tr>
  `).join('');
  els.signalsWrap.innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Strategy</th><th>Side</th><th>Entry</th><th>Stop</th><th>TP1</th><th>TP2</th><th>TP3</th><th>Score</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function drawPlaceholder(canvas,msg){
  const ctx=canvas.getContext('2d'), r=canvas.getBoundingClientRect();
  if (!r.width) return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr; canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0b0d10'; ctx.fillRect(0,0,r.width,r.height);
  ctx.fillStyle='#6b7280'; ctx.font='13px ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(msg, r.width/2, r.height/2);
}

function drawDiamond(ctx,x,y,s){ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.closePath();ctx.fill();}

function drawStructMarker(ctx,x,y,kind,dir){
  if (kind==='bos'){
    ctx.fillStyle='#eab308'; const d=dir==='bull'?-1:1;
    ctx.beginPath(); ctx.moveTo(x,y+d*6); ctx.lineTo(x-4,y-d*3); ctx.lineTo(x+4,y-d*3); ctx.closePath(); ctx.fill();
  } else if (kind==='choch'){ ctx.fillStyle='#eab308'; drawDiamond(ctx,x,y,5); }
  else if (kind==='mss'){
    ctx.fillStyle='#d946ef'; ctx.beginPath();
    for (let i=0;i<10;i++){
      const a=-Math.PI/2 + i*Math.PI/5, r=i%2===0?6:2.5;
      const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
}

function renderChart(canvas, candles, o){
  const ctx=canvas.getContext('2d'), r=canvas.getBoundingClientRect();
  if (!r.width) return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr; canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,padL=62,padR=62,padT=12,padB=28;
  const cw=W-padL-padR, ch=H-padT-padB;
  ctx.fillStyle='#0b0d10'; ctx.fillRect(0,0,W,H);

  const end=candles.length, start=Math.max(0,end-o.window);
  const vis=candles.slice(start,end);
  if (!vis.length) return;

  let lo=Infinity, hi=-Infinity;
  for (const c of vis){ if(c.low<lo)lo=c.low; if(c.high>hi)hi=c.high; }
  for (const z of o.zones){ if(z.bottom<lo)lo=z.bottom; if(z.top>hi)hi=z.top; }
  for (const f of o.fvgs){ if(f.bottom<lo)lo=f.bottom; if(f.top>hi)hi=f.top; }
  for (const s of o.signals){
    if (s.idx<start) continue;
    lo=Math.min(lo,s.stop,s.entry,s.tp1,s.tp2,s.tp3);
    hi=Math.max(hi,s.stop,s.entry,s.tp1,s.tp2,s.tp3);
  }
  const m=(hi-lo)*0.05||1; hi+=m; lo-=m;

  const xOf=i=>padL+(i-start)/Math.max(1,end-start)*cw;
  const yOf=p=>padT+(hi-p)/Math.max(1e-9,hi-lo)*ch;

  ctx.font='10px ui-monospace,monospace'; ctx.textBaseline='middle'; ctx.textAlign='right';
  for (let i=0;i<=6;i++){
    const p=lo+(hi-lo)*i/6, y=yOf(p);
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle='#6b7280'; ctx.fillText(p.toFixed(2), padL-8, y);
  }

  for (const z of o.zones){
    const x0=xOf(Math.max(start,z.startIdx)); if (x0>=W-padR) continue;
    const yT=yOf(z.top),yB=yOf(z.bottom);
    ctx.fillStyle = z.side==='bull' ? 'rgba(34,197,94,0.10)' : 'rgba(239,68,68,0.10)';
    ctx.fillRect(x0,yT,W-padR-x0,yB-yT);
    ctx.strokeStyle = z.side==='bull' ? 'rgba(34,197,94,0.35)' : 'rgba(239,68,68,0.35)';
    ctx.lineWidth=1; ctx.strokeRect(x0,yT,W-padR-x0,yB-yT);
  }
  for (const f of o.fvgs){
    const x0=xOf(Math.max(start,f.startIdx)); if (x0>=W-padR) continue;
    const yT=yOf(f.top),yB=yOf(f.bottom);
    ctx.fillStyle = f.side==='bull' ? 'rgba(59,130,246,0.10)' : 'rgba(168,85,247,0.10)';
    ctx.fillRect(x0,yT,W-padR-x0,yB-yT);
  }
  for (const iv of o.ifvgs){
    const f=iv.fvg, x0=xOf(Math.max(start,f.startIdx)); if (x0>=W-padR) continue;
    const yT=yOf(f.top),yB=yOf(f.bottom);
    ctx.fillStyle='rgba(234,179,8,0.08)'; ctx.fillRect(x0,yT,W-padR-x0,yB-yT);
  }

  const cwBar=cw/Math.max(1,vis.length), bw=Math.max(1,cwBar*0.7);
  for (let i=0;i<vis.length;i++){
    const c=vis[i], x=xOf(start+i)+cwBar/2, up=c.close>=c.open;
    ctx.strokeStyle=ctx.fillStyle=up?'#22c55e':'#ef4444';
    ctx.beginPath(); ctx.moveTo(x,yOf(c.high)); ctx.lineTo(x,yOf(c.low)); ctx.stroke();
    const yO=yOf(c.open), yC=yOf(c.close);
    ctx.fillRect(x-bw/2, Math.min(yO,yC), bw, Math.max(1,Math.abs(yC-yO)));
  }

  for (const ev of o.structures){ if (ev.idx>=start && ev.idx<end) drawStructMarker(ctx, xOf(ev.idx), yOf(ev.level), ev.kind, ev.direction); }
  for (const sw of o.sweeps){ if (sw.idx>=start && sw.idx<end){ ctx.strokeStyle='#22d3ee'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(xOf(sw.idx), yOf(sw.level), 4, 0, Math.PI*2); ctx.stroke(); } }
  for (const iv of o.ifvgs){ if (iv.idx>=start && iv.idx<end){ ctx.fillStyle='#d946ef'; drawDiamond(ctx, xOf(iv.idx), yOf(iv.entryPrice), 4); } }

  for (const sig of o.signals){
    if (sig.idx<start || sig.idx>=end) continue;
    const x0=xOf(sig.idx), x1=W-padR;
    ctx.strokeStyle='#22c55e'; ctx.lineWidth=1.4; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x0,yOf(sig.entry)); ctx.lineTo(x1,yOf(sig.entry)); ctx.stroke();
    ctx.strokeStyle='#ef4444'; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x0,yOf(sig.stop)); ctx.lineTo(x1,yOf(sig.stop)); ctx.stroke();
    ctx.strokeStyle='#eab308'; ctx.setLineDash([2,4]);
    for (const tp of [sig.tp1,sig.tp2,sig.tp3]){
      ctx.beginPath(); ctx.moveTo(x0,yOf(tp)); ctx.lineTo(x1,yOf(tp)); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.font='bold 9px ui-monospace,monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
    const lx=W-padR+3;
    ctx.fillStyle='#22c55e'; ctx.fillText('E',  lx, yOf(sig.entry));
    ctx.fillStyle='#ef4444'; ctx.fillText('SL', lx, yOf(sig.stop));
    ctx.fillStyle='#eab308'; ctx.fillText('T1', lx, yOf(sig.tp1)); ctx.fillText('T2', lx, yOf(sig.tp2));
    ctx.fillStyle='#d97706'; ctx.fillText('T3', lx, yOf(sig.tp3));
  }

  const lastPrice=candles[candles.length-1].close, yLast=yOf(lastPrice);
  ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(padL,yLast); ctx.lineTo(W-padR,yLast); ctx.stroke(); ctx.setLineDash([]);
  const bW=56,bH=16;
  ctx.fillStyle='#ffffff'; ctx.fillRect(W-padR+2, yLast-bH/2, bW, bH);
  ctx.fillStyle='#0b0d10'; ctx.font='bold 10px ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(lastPrice.toFixed(2), W-padR+2+bW/2, yLast);

  ctx.fillStyle='#6b7280'; ctx.font='9px ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for (let i=0;i<=6;i++){
    const idx=start+Math.floor((end-start)*i/6); if (idx>=end) continue;
    const d=new Date(candles[idx].ts*1000);
    const isD = o.interval==='1day';
    const label = isD ? `${d.getUTCMonth()+1}/${d.getUTCDate()}`
                      : `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
    ctx.fillText(label, xOf(idx), H-padB+4);
  }
}

let lastData=null;

async function runAnalysis(){
  const interval   = els.interval.value;
  const outputsize = Math.max(100, parseInt(els.outputsize.value,10)||500);
  const window     = Math.max(20,  parseInt(els.window.value,10)||100);
  const htfRatio   = Math.max(2,   parseInt(els.htfRatio.value,10)||5);
  const minScore   = Math.max(0,   parseInt(els.minScore.value,10)||6);

  els.fetchBtn.disabled=true;
  setStatus(`Fetching ${outputsize} × ${interval} candles…`, 'info', true);

  try {
    const url = `/api/analyze?interval=${encodeURIComponent(interval)}`
              + `&outputsize=${outputsize}&htf_ratio=${htfRatio}&min_score=${minScore}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);

    const chartOpts = {
      window, interval,
      zones:     data.zones,
      fvgs:      data.fvgs,
      ifvgs:     data.ifvgs,
      structures:data.structures,
      sweeps:    data.sweeps,
      signals:   data.signals,
    };
    lastData = { candles: data.candles, opts: chartOpts };

    renderChart(els.chart, data.candles, chartOpts);
    updateBias(data.bias);
    renderSignals(data.signals, minScore);

    setStatus(`✔ Done — ${data.signals.length} signal${data.signals.length===1?'':'s'} found on ${data.symbol} ${data.interval}.`, 'success');
  } catch (e){
    console.error(e);
    if (e instanceof TypeError && String(e.message).includes('fetch')) {
      setStatus('✖ Cannot reach the Aurum server. Run `cargo run -- serve` and open http://localhost:3000', 'error');
    } else {
      setStatus(`✖ ${e.message || e}`, 'error');
    }
  } finally {
    els.fetchBtn.disabled=false;
  }
}

els.fetchBtn.addEventListener('click', runAnalysis);

requestAnimationFrame(()=>drawPlaceholder(els.chart,'Click Fetch & Analyze to start'));
new ResizeObserver(()=>{
  if (lastData) renderChart(els.chart, lastData.candles, lastData.opts);
  else drawPlaceholder(els.chart,'Click Fetch & Analyze to start');
}).observe(els.chart);
</script>
</body>
</html>
