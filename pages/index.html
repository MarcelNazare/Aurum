<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURUM · XAU/USD ICT Scanner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
  :root{--bg:#0b0d10;--bg-soft:#14171c;--border:#1f242b;--text:#e5e7eb;--dim:#6b7280;
        --green:#22c55e;--red:#ef4444;--gold:#d4af37;--cyan:#22d3ee;--magenta:#d946ef;--amber:#eab308;
        --blue:#3b82f6;--purple:#a855f7}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
  header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:20px;color:var(--gold);letter-spacing:.15em;font-weight:700}
  .subtitle{color:var(--dim);font-size:13px}
  .badge{margin-left:auto;padding:3px 8px;border:1px solid var(--border);border-radius:3px;font-size:10px;color:var(--green)}
  .config{padding:16px 24px;border-bottom:1px solid var(--border);display:grid;gap:12px}
  .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  input,select{padding:8px 10px;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);border-radius:4px;font-family:inherit;font-size:13px;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{padding:9px 18px;background:var(--gold);color:var(--bg);border:none;border-radius:4px;font-family:inherit;font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.04em;transition:opacity .15s}
  button:hover:not(:disabled){opacity:.85}
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{padding:10px 24px;font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .status.info{color:var(--cyan)}.status.error{color:var(--red)}.status.success{color:var(--green)}
  .hidden{display:none!important}
  .spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bias{padding:12px 24px;font-size:14px;border-bottom:1px solid var(--border);background:var(--bg-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bias.bull strong{color:var(--green)}.bias.bear strong{color:var(--red)}
  .bias .as-of{margin-left:auto;color:var(--dim);font-size:11px}
  .chart-wrap{position:relative;padding:0 24px;margin-top:16px}
  #chart{display:block;width:100%;height:560px;border-radius:6px;background:#0b0d10;cursor:crosshair}
  .chart-info{position:absolute;top:8px;left:36px;right:36px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);pointer-events:none;z-index:5;gap:12px;flex-wrap:wrap}
  .chart-info button{pointer-events:auto;padding:3px 8px;font-size:10px;background:rgba(20,23,28,.85);border:1px solid var(--border);color:var(--text);border-radius:3px;cursor:pointer;font-family:inherit;letter-spacing:0}
  .chart-info button:hover{border-color:var(--gold);color:var(--gold)}
  .tooltip{position:absolute;background:rgba(11,13,16,.98);border:1px solid var(--gold);border-radius:6px;padding:10px 12px;font-size:12px;font-family:inherit;color:var(--text);pointer-events:none;z-index:100;box-shadow:0 4px 24px rgba(0,0,0,.7);min-width:180px;max-width:320px;backdrop-filter:blur(6px)}
  .tooltip.hidden{display:none}
  .tt-header{font-size:11px;color:var(--gold);letter-spacing:.06em;font-weight:700;text-transform:uppercase;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .tt-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
  .tt-label{color:var(--dim);font-size:11px}
  .tt-val{text-align:right;font-variant-numeric:tabular-nums}
  .tt-val.bull{color:var(--green)}.tt-val.bear{color:var(--red)}.tt-val.gold{color:var(--gold);font-weight:700}
  .tt-dim{color:var(--dim);font-size:10px}
  .tt-pills{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px}
  .tt-pills .pill{margin-right:0}
  .legend{padding:10px 24px 16px;font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:14px}
  .legend span{white-space:nowrap}.legend span::before{content:'■';margin-right:4px;font-size:12px}
  .legend .bos::before{content:'▲';color:var(--amber)}
  .legend .choch::before{content:'◆';color:var(--amber)}
  .legend .mss::before{content:'✦';color:var(--magenta)}
  .legend .sweep::before{content:'○';color:var(--cyan)}
  .legend .ifvg::before{content:'◆';color:var(--magenta)}
  .legend .fvg::before{content:'░';color:var(--blue)}
  .legend .supply::before{color:var(--red)}.legend .demand::before{color:var(--green)}
  .legend .entry::before{content:'─';color:var(--green)}
  .legend .stop::before{content:'─';color:var(--red)}
  .legend .tp::before{content:'─';color:var(--amber)}
  .signals{padding:20px 24px 40px;border-top:1px solid var(--border)}
  .signals h2{margin:0 0 12px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .empty-state{padding:24px;text-align:center;color:var(--dim);border:1px dashed var(--border);border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
  th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){text-align:left}
  thead th{background:var(--bg-soft);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  tbody td.side.bull{color:var(--green);font-weight:700}
  tbody td.side.bear{color:var(--red);font-weight:700}
  tbody td.score{font-weight:700}
  tbody td.score.s9plus{color:var(--gold)}
  .reasons-row td{border-bottom:1px solid var(--border);padding-top:0;padding-bottom:8px;text-align:left}
  .pill{display:inline-block;padding:1px 6px;margin-right:4px;background:var(--bg-soft);border-radius:3px;font-size:10px;color:var(--dim)}
  footer{padding:16px 24px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);text-align:center}
</style>
</head>
<body>

<header>
  <h1>AURUM</h1>
  <span class="subtitle">XAU/USD · ICT Scanner</span>
  <span class="badge">● server mode</span>
</header>

<section class="config">
  <div class="field-row">
    <div class="field">
      <label for="interval">Interval</label>
      <select id="interval">
        <option>1min</option><option>5min</option>
        <option selected>15min</option><option>30min</option>
        <option>1h</option><option>4h</option><option>1day</option>
      </select>
    </div>
    <div class="field"><label for="outputsize">Bars</label><input type="number" id="outputsize" value="500" min="100" max="5000"></div>
    <div class="field"><label for="window">Window</label><input type="number" id="window" value="100" min="20" max="500"></div>
    <div class="field"><label for="htfRatio">HTF Ratio</label><input type="number" id="htfRatio" value="5" min="2" max="50"></div>
    <div class="field"><label for="minScore">Min Score</label><input type="number" id="minScore" value="6" min="0" max="12"></div>
  </div>
  <div class="actions"><button id="fetchBtn" type="button">Fetch &amp; Analyze</button></div>
</section>

<div id="status" class="status hidden"></div>
<section id="biasBar" class="bias hidden"></section>

<section class="chart-wrap" id="chartWrap">
  <canvas id="chart"></canvas>
  <div class="chart-info">
    <span id="chartRange"></span>
    <button id="resetViewBtn" type="button">Reset view</button>
  </div>
  <div id="tooltip" class="tooltip hidden"></div>
</section>

<section class="legend">
  <span class="bos">BOS</span><span class="choch">ChoCh</span><span class="mss">MSS</span>
  <span class="sweep">Sweep</span><span class="ifvg">IFVG</span><span class="fvg">FVG</span>
  <span class="supply">Supply</span><span class="demand">Demand</span>
  <span class="entry">Entry</span><span class="stop">Stop</span><span class="tp">TP1/2/3</span>
</section>

<section class="signals">
  <h2>Signals</h2>
  <div id="signalsWrap"><div class="empty-state">Click <strong>Fetch &amp; Analyze</strong> to run the scanner.</div></div>
</section>
<footer>AURUM · analysis runs on the local Rust server · no financial advice</footer>

<script>
const els = {
  interval:    document.getElementById('interval'),
  outputsize:  document.getElementById('outputsize'),
  window:      document.getElementById('window'),
  htfRatio:    document.getElementById('htfRatio'),
  minScore:    document.getElementById('minScore'),
  fetchBtn:    document.getElementById('fetchBtn'),
  status:      document.getElementById('status'),
  biasBar:     document.getElementById('biasBar'),
  chart:       document.getElementById('chart'),
  chartWrap:   document.getElementById('chartWrap'),
  chartRange:  document.getElementById('chartRange'),
  resetBtn:    document.getElementById('resetViewBtn'),
  tooltip:     document.getElementById('tooltip'),
  signalsWrap: document.getElementById('signalsWrap'),
};

const state = {
  candles: [], opts: null, window: 100, offset: 0, layout: null,
  mouse: { x: -1, y: -1, active: false }, hover: null, drag: null,
};

const pad2 = n => String(n).padStart(2, '0');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtTsFull(ts, interval) {
  const d = new Date(ts * 1000);
  if (interval === '1day') return `${pad2(d.getUTCDate())} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
}
function fmtTsShort(ts, interval) {
  const d = new Date(ts * 1000);
  if (interval === '1day') return `${pad2(d.getUTCDate())}/${pad2(d.getUTCMonth()+1)}`;
  return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
}

function setStatus(msg, type='info', loading=false){
  els.status.innerHTML='';
  if (loading) { const s=document.createElement('span'); s.className='spinner'; els.status.appendChild(s); }
  const t=document.createElement('span'); t.textContent=msg; els.status.appendChild(t);
  els.status.className=`status ${type}`;
  els.status.classList.remove('hidden');
}
function updateBias(b){
  const label = b.direction === 'bull' ? 'LONG' : 'SHORT';
  const detail = (b.kind && b.idx !== null) ? ` · last HTF ${b.kind.toUpperCase()} @ bar ${b.idx}` : '';
  const asOf = `as of ${new Date().toUTCString().replace('GMT','UTC')}`;
  els.biasBar.innerHTML = `BIAS: <strong class="${b.direction}">${label}</strong>${detail}<span class="as-of">${asOf}</span>`;
  els.biasBar.className = `bias ${b.direction}`;
  els.biasBar.classList.remove('hidden');
}

function getStatusBadge(status) {
  switch(status) {
    case 'active': return '<span style="color:var(--green);font-weight:bold;border:1px solid var(--green);padding:1px 4px;border-radius:3px;font-size:10px">ACTIVE</span>';
    case 'waiting': return '<span style="color:var(--cyan);border:1px solid var(--cyan);padding:1px 4px;border-radius:3px;font-size:10px">WAITING</span>';
    case 'invalidated': return '<span style="color:var(--red);opacity:0.6;border:1px solid var(--red);padding:1px 4px;border-radius:3px;font-size:10px">INVALID</span>';
    case 'completed': return '<span style="color:var(--gold);border:1px solid var(--gold);padding:1px 4px;border-radius:3px;font-size:10px">TP HIT</span>';
    default: return `<span>${status}</span>`;
  }
}

function renderSignals(signals, minScore){
  if (!signals.length){
    els.signalsWrap.innerHTML = `<div class="empty-state">No signals above threshold (${minScore}). Try lowering Min Score or increasing Bars.</div>`;
    return;
  }
  const rows = signals.map((s,i)=>`
    <tr>
      <td>${i+1}</td><td>${s.strategy}</td>
      <td class="side ${s.side}">${s.side==='bull'?'LONG':'SHORT'}</td>
      <td>${s.isTrendFollowing ? '<span style="color:var(--green)">Trend</span>' : '<span style="color:var(--amber)">Counter</span>'}</td>
      <td>${getStatusBadge(s.status)}</td>
      <td style="color:var(--cyan)">${s.eta}</td>
      <td>${s.entry.toFixed(2)}</td><td>${s.stop.toFixed(2)}</td>
      <td>${s.tp1.toFixed(2)}</td><td>${s.tp2.toFixed(2)}</td><td>${s.tp3.toFixed(2)}</td>
      <td class="score${s.score>=9?' s9plus':''}">${s.score}/12</td>
    </tr>
    <tr class="reasons-row"><td colspan="12">${s.reasons.map(r=>`<span class="pill">${r}</span>`).join('')}</td></tr>
  `).join('');
  els.signalsWrap.innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Strategy</th><th>Side</th><th>Type</th><th>Status</th><th>ETA</th><th>Entry</th><th>Stop</th><th>TP1</th><th>TP2</th><th>TP3</th><th>Score</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function drawPlaceholder(canvas,msg){
  const ctx=canvas.getContext('2d'), r=canvas.getBoundingClientRect();
  if (!r.width) return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr; canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0b0d10'; ctx.fillRect(0,0,r.width,r.height);
  ctx.fillStyle='#6b7280'; ctx.font='13px ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(msg, r.width/2, r.height/2);
}

function drawDiamond(ctx,x,y,s){ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.closePath();ctx.fill();}

function drawStructMarker(ctx,x,y,kind,dir){
  if (kind==='bos'){
    ctx.fillStyle='#eab308'; const d=dir==='bull'?-1:1;
    ctx.beginPath(); ctx.moveTo(x,y+d*6); ctx.lineTo(x-4,y-d*3); ctx.lineTo(x+4,y-d*3); ctx.closePath(); ctx.fill();
  } else if (kind==='choch'){ ctx.fillStyle='#eab308'; drawDiamond(ctx,x,y,5); }
  else if (kind==='mss'){
    ctx.fillStyle='#d946ef'; ctx.beginPath();
    for (let i=0;i<10;i++){
      const a=-Math.PI/2 + i*Math.PI/5, r=i%2===0?6:2.5;
      const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
}

function renderChart(canvas, candles, o){
  const ctx=canvas.getContext('2d'), r=canvas.getBoundingClientRect();
  if (!r.width) return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr; canvas.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,padL=62,padR=62,padT=12,padB=28;
  const cw=W-padL-padR, ch=H-padT-padB;
  ctx.fillStyle='#0b0d10'; ctx.fillRect(0,0,W,H);

  const win = state.window || 100;
  const end=candles.length, start=Math.max(0,end-win);
  const vis=candles.slice(start,end);
  if (!vis.length) return;

  let lo=Infinity, hi=-Infinity;
  for (const c of vis){ if(c.low<lo)lo=c.low; if(c.high>hi)hi=c.high; }
  for (const z of o.zones){ if(z.bottom<lo)lo=z.bottom; if(z.top>hi)hi=z.top; }
  for (const f of o.fvgs){ if(f.bottom<lo)lo=f.bottom; if(f.top>hi)hi=f.top; }
  
  for (const s of o.signals){
    if (s.idx >= end) continue;
    if (s.status === 'invalidated' || s.status === 'completed') continue;
    lo=Math.min(lo,s.stop,s.entry,s.tp1,s.tp2,s.tp3);
    hi=Math.max(hi,s.stop,s.entry,s.tp1,s.tp2,s.tp3);
  }
  const m=(hi-lo)*0.05||1; hi+=m; lo-=m;

  const xOf=i=>padL+(i-start)/Math.max(1,end-start)*cw;
  const yOf=p=>padT+(hi-p)/Math.max(1e-9,hi-lo)*ch;

  state.layout = {
    start, end, lo, hi, xOf, yOf, W, H, padL, padR, padT, padB,
    idxFromPx: (px) => start + Math.round((px - padL) / Math.max(1, cw) * (end - start))
  };

  ctx.font='10px ui-monospace,monospace'; ctx.textBaseline='middle'; ctx.textAlign='right';
  for (let i=0;i<=6;i++){
    const p=lo+(hi-lo)*i/6, y=yOf(p);
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle='#6b7280'; ctx.fillText(p.toFixed(2), padL-8, y);
  }

  for (const z of o.zones){
    const x0=xOf(Math.max(start,z.startIdx)); if (x0>=W-padR) continue;
    const yT=yOf(z.top),yB=yOf(z.bottom);
    ctx.fillStyle = z.side==='bull' ? 'rgba(34,197,94,0.10)' : 'rgba(239,68,68,0.10)';
    ctx.fillRect(x0,yT,W-padR-x0,yB-yT);
    ctx.strokeStyle = z.side==='bull' ? 'rgba(34,197,94,0.35)' : 'rgba(239,68,68,0.35)';
    ctx.lineWidth=1; ctx.strokeRect(x0,yT,W-padR-x0,yB-yT);
  }
  for (const f of o.fvgs){
    const x0=xOf(Math.max(start,f.startIdx)); if (x0>=W-padR) continue;
    const yT=yOf(f.top),yB=yOf(f.bottom);
    ctx.fillStyle = f.side==='bull' ? 'rgba(59,130,246,0.10)' : 'rgba(168,85,247,0.10)';
    ctx.fillRect(x0,yT,W-padR-x0,yB-yT);
  }
  for (const iv of o.ifvgs){
    const f=iv.fvg, x0=xOf(Math.max(start,f.startIdx)); if (x0>=W-padR) continue;
    const yT=yOf(f.top),yB=yOf(f.bottom);
    ctx.fillStyle='rgba(234,179,8,0.08)'; ctx.fillRect(x0,yT,W-padR-x0,yB-yT);
  }

  const cwBar=cw/Math.max(1,vis.length), bw=Math.max(1,cwBar*0.7);
  for (let i=0;i<vis.length;i++){
    const c=vis[i], x=xOf(start+i)+cwBar/2, up=c.close>=c.open;
    ctx.strokeStyle=ctx.fillStyle=up?'#22c55e':'#ef4444';
    ctx.beginPath(); ctx.moveTo(x,yOf(c.high)); ctx.lineTo(x,yOf(c.low)); ctx.stroke();
    const yO=yOf(c.open), yC=yOf(c.close);
    ctx.fillRect(x-bw/2, Math.min(yO,yC), bw, Math.max(1,Math.abs(yC-yO)));
  }

  for (const ev of o.structures){ if (ev.idx>=start && ev.idx<end) drawStructMarker(ctx, xOf(ev.idx), yOf(ev.level), ev.kind, ev.direction); }
  for (const sw of o.sweeps){ if (sw.idx>=start && sw.idx<end){ ctx.strokeStyle='#22d3ee'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(xOf(sw.idx), yOf(sw.level), 4, 0, Math.PI*2); ctx.stroke(); } }
  for (const iv of o.ifvgs){ if (iv.idx>=start && iv.idx<end){ ctx.fillStyle='#d946ef'; drawDiamond(ctx, xOf(iv.idx), yOf(iv.entryPrice), 4); } }

  for (const sig of o.signals){
    if (sig.idx >= end) continue;
    const x0 = Math.max(padL, xOf(sig.idx));
    const x1 = W - padR;
    
    const isHovered = state.hover && state.hover.type === 'signal' && state.hover.data === sig;
    const isActive = sig.status === 'active';
    const isInvalidated = sig.status === 'invalidated' || sig.status === 'completed';
    
    const riskTop = Math.min(yOf(sig.entry), yOf(sig.stop));
    const riskBot = Math.max(yOf(sig.entry), yOf(sig.stop));
    ctx.fillStyle = isHovered ? 'rgba(239,68,68,0.15)' : (isInvalidated ? 'rgba(239,68,68,0.03)' : 'rgba(239,68,68,0.08)');
    ctx.fillRect(x0, riskTop, x1 - x0, riskBot - riskTop);

    const rewardTop = Math.min(yOf(sig.entry), yOf(sig.tp3));
    const rewardBot = Math.max(yOf(sig.entry), yOf(sig.tp3));
    ctx.fillStyle = isHovered ? 'rgba(34,197,94,0.15)' : (isInvalidated ? 'rgba(34,197,94,0.03)' : 'rgba(34,197,94,0.05)');
    ctx.fillRect(x0, rewardTop, x1 - x0, rewardBot - rewardTop);
    
    const entryCol = isHovered ? '#22c55e' : (isInvalidated ? 'rgba(34,197,94,0.6)' : '#22c55e');
    const stopCol = isHovered ? '#ef4444' : (isInvalidated ? 'rgba(239,68,68,0.6)' : '#ef4444');
    const tpCol = isHovered ? '#eab308' : (isInvalidated ? 'rgba(234,179,8,0.6)' : '#eab308');

    const ew = isHovered || isActive ? 2.5 : 1.4;
    const sw = isHovered || isActive ? 2.0 : 1.2;

    ctx.strokeStyle=entryCol; ctx.lineWidth=ew; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x0,yOf(sig.entry)); ctx.lineTo(x1,yOf(sig.entry)); ctx.stroke();
    
    ctx.strokeStyle=stopCol; ctx.lineWidth=sw; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x0,yOf(sig.stop)); ctx.lineTo(x1,yOf(sig.stop)); ctx.stroke();
    
    ctx.strokeStyle=tpCol; ctx.lineWidth=ew * 0.8; ctx.setLineDash([2,4]);
    for (const tp of [sig.tp1,sig.tp2,sig.tp3]){
      ctx.beginPath(); ctx.moveTo(x0,yOf(tp)); ctx.lineTo(x1,yOf(tp)); ctx.stroke();
    }
    ctx.setLineDash([]);
    
    ctx.font='bold 10px ui-monospace,monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
    const lx=W-padR+3;
    ctx.fillStyle=entryCol; ctx.fillText('E',  lx, yOf(sig.entry));
    ctx.fillStyle=stopCol; ctx.fillText('SL', lx, yOf(sig.stop));
    ctx.fillStyle=tpCol; ctx.fillText('T1', lx, yOf(sig.tp1)); ctx.fillText('T2', lx, yOf(sig.tp2));
    ctx.fillText('T3', lx, yOf(sig.tp3));

    if (sig.idx >= start) {
        const color = isInvalidated ? 'rgba(200,200,200,0.6)' : (sig.side === 'bull' ? '#22c55e' : '#ef4444');
        ctx.fillStyle = color;
        ctx.beginPath();
        const markerY = yOf(sig.entry);
        if (sig.side === 'bull') {
            ctx.moveTo(x0 - 5, markerY - 5); ctx.lineTo(x0 + 5, markerY - 5); ctx.lineTo(x0, markerY + 4);
        } else {
            ctx.moveTo(x0 - 5, markerY + 5); ctx.lineTo(x0 + 5, markerY + 5); ctx.lineTo(x0, markerY - 4);
        }
        ctx.closePath(); ctx.fill();
    }
  }

  const lastPrice=candles[candles.length-1].close, yLast=yOf(lastPrice);
  ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(padL,yLast); ctx.lineTo(W-padR,yLast); ctx.stroke(); ctx.setLineDash([]);
  const bW=56,bH=16;
  ctx.fillStyle='#ffffff'; ctx.fillRect(W-padR+2, yLast-bH/2, bW, bH);
  ctx.fillStyle='#0b0d10'; ctx.font='bold 10px ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(lastPrice.toFixed(2), W-padR+2+bW/2, yLast);

  ctx.fillStyle='#6b7280'; ctx.font='9px ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  for (let i=0;i<=6;i++){
    const idx=start+Math.floor((end-start)*i/6); if (idx>=end || idx>=candles.length) continue;
    const c = candles[idx];
    if (!c || typeof c.ts === 'undefined') continue;
    const d=new Date(c.ts*1000);
    const isD = o.interval==='1day';
    const label = isD ? `${d.getUTCMonth()+1}/${d.getUTCDate()}`
                      : `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
    ctx.fillText(label, xOf(idx), H-padB+4);
  }
}

function hitTest(mx, my) {
  const L = state.layout;
  if (!L) return null;
  
  const { start, end, xOf, yOf, idxFromPx, W, H, padL, padR, padT, padB } = L;
  if (mx < padL || mx > W - padR || my < padT || my > H - padB) return null;

  for (const sig of state.opts.signals) {
    if (sig.idx >= end) continue;
    const x0 = Math.max(padL, xOf(sig.idx));
    if (mx < x0) continue;
    const lines = [sig.entry, sig.stop, sig.tp1, sig.tp2, sig.tp3];
    for (const p of lines) {
      if (Math.abs(my - yOf(p)) < 8) return { type: 'signal', data: sig };
    }
  }

  for (const ev of state.opts.structures) {
    if (ev.idx < start || ev.idx >= end) continue;
    if (Math.hypot(mx - xOf(ev.idx), my - yOf(ev.level)) < 10) return { type: 'marker', kind: ev.kind, data: ev };
  }
  for (const sw of state.opts.sweeps) {
    if (sw.idx < start || sw.idx >= end) continue;
    if (Math.hypot(mx - xOf(sw.idx), my - yOf(sw.level)) < 9) return { type: 'sweep', data: sw };
  }
  for (const iv of state.opts.ifvgs) {
    if (iv.idx < start || iv.idx >= end) continue;
    if (Math.hypot(mx - xOf(iv.idx), my - yOf(iv.entryPrice)) < 9) return { type: 'ifvg', data: iv };
  }

  for (const z of state.opts.zones) {
    const x0 = xOf(Math.max(start, z.startIdx));
    if (x0 >= W - padR || mx < x0) continue;
    const yT = yOf(z.top), yB = yOf(z.bottom);
    if (my >= Math.min(yT, yB) && my <= Math.max(yT, yB)) return { type: 'zone', data: z };
  }

  const idx = idxFromPx(mx);
  if (idx >= start && idx < end && idx < state.candles.length) {
    return { type: 'candle', data: state.candles[idx], idx };
  }
  return null;
}

function buildTooltipHtml(h) {
  if (!h) return '';
  const iv = state.opts.interval;

  switch (h.type) {
    case 'candle': {
      const c = h.data, up = c.close >= c.open, cls = up ? 'bull' : 'bear';
      const chg = ((c.close - c.open) / c.open * 100).toFixed(2);
      return `
        <div class="tt-header">${fmtTsFull(c.ts, iv)}</div>
        <div class="tt-grid">
          <span class="tt-label">Open</span><span class="tt-val ${cls}">${c.open.toFixed(2)}</span>
          <span class="tt-label">High</span><span class="tt-val ${cls}">${c.high.toFixed(2)}</span>
          <span class="tt-label">Low</span><span class="tt-val ${cls}">${c.low.toFixed(2)}</span>
          <span class="tt-label">Close</span><span class="tt-val ${cls}">${c.close.toFixed(2)}</span>
          <span class="tt-label">Change</span><span class="tt-val ${cls}">${up?'+':''}${chg}%</span>
          <span class="tt-label">Bar</span><span class="tt-val">#${h.idx}</span>
        </div>`;
    }
    case 'marker': {
      const ev = h.data, kind = h.kind.toUpperCase(), dir = ev.direction === 'bull' ? 'BULLISH' : 'BEARISH';
      const cls = ev.direction === 'bull' ? 'bull' : 'bear';
      return `
        <div class="tt-header">${kind} · ${dir}</div>
        <div class="tt-grid">
          <span class="tt-label">Level</span><span class="tt-val ${cls}">${ev.level.toFixed(2)}</span>
          <span class="tt-label">Bar</span><span class="tt-val">#${ev.idx}</span>
          <span class="tt-label">Time</span><span class="tt-val">${fmtTsFull(state.candles[ev.idx]?.ts || 0, iv)}</span>
        </div>`;
    }
    case 'sweep': {
      const sw = h.data, dir = sw.direction === 'bull' ? 'BULLISH' : 'BEARISH';
      const cls = sw.direction === 'bull' ? 'bull' : 'bear';
      return `
        <div class="tt-header">Liquidity Sweep · ${dir}</div>
        <div class="tt-grid">
          <span class="tt-label">Level</span><span class="tt-val ${cls}">${sw.level.toFixed(2)}</span>
          <span class="tt-label">Bar</span><span class="tt-val">#${sw.idx}</span>
          <span class="tt-label">Time</span><span class="tt-val">${fmtTsFull(state.candles[sw.idx]?.ts || 0, iv)}</span>
        </div>`;
    }
    case 'ifvg': {
      const ivg = h.data, dir = ivg.side === 'bull' ? 'BULLISH' : 'BEARISH';
      const cls = ivg.side === 'bull' ? 'bull' : 'bear';
      return `
        <div class="tt-header">Inverse FVG · ${dir}</div>
        <div class="tt-grid">
          <span class="tt-label">Entry</span><span class="tt-val ${cls}">${ivg.entryPrice.toFixed(2)}</span>
          <span class="tt-label">Gap top</span><span class="tt-val">${ivg.fvg.top.toFixed(2)}</span>
          <span class="tt-label">Gap bottom</span><span class="tt-val">${ivg.fvg.bottom.toFixed(2)}</span>
          <span class="tt-label">Time</span><span class="tt-val">${fmtTsFull(state.candles[ivg.idx]?.ts || 0, iv)}</span>
        </div>`;
    }
    case 'zone': {
      const z = h.data, cls = z.side === 'bull' ? 'bull' : 'bear';
      return `
        <div class="tt-header">${z.label} Zone</div>
        <div class="tt-grid">
          <span class="tt-label">Top</span><span class="tt-val ${cls}">${z.top.toFixed(2)}</span>
          <span class="tt-label">Bottom</span><span class="tt-val ${cls}">${z.bottom.toFixed(2)}</span>
          <span class="tt-label">Height</span><span class="tt-val">${(z.top - z.bottom).toFixed(2)}</span>
          <span class="tt-label">Start</span><span class="tt-val">${fmtTsFull(state.candles[z.startIdx]?.ts || 0, iv)}</span>
        </div>`;
    }
    case 'signal': {
      const s = h.data;
      const cls = s.side === 'bull' ? 'bull' : 'bear';
      const risk = Math.abs(s.entry - s.stop);
      const rr1 = risk > 0 ? (Math.abs(s.tp1 - s.entry) / risk).toFixed(1) : '—';
      const statusColor = s.status === 'active' ? 'var(--green)' : s.status === 'waiting' ? 'var(--cyan)' : s.status === 'completed' ? 'var(--gold)' : 'var(--red)';
      return `
        <div class="tt-header">${s.strategy}</div>
        <div class="tt-grid">
          <span class="tt-label">Side</span><span class="tt-val ${cls}">${s.side==='bull'?'LONG':'SHORT'}</span>
          <span class="tt-label">Type</span><span class="tt-val">${s.isTrendFollowing ? '<span style="color:var(--green)">Trend</span>' : '<span style="color:var(--amber)">Counter</span>'}</span>
          <span class="tt-label">Status</span><span class="tt-val" style="color:${statusColor};font-weight:bold">${(s.status || 'unknown').toUpperCase()}</span>
          <span class="tt-label">ETA</span><span class="tt-val" style="color:var(--cyan)">${s.eta}</span>
          <span class="tt-label">Entry</span><span class="tt-val">${s.entry.toFixed(2)}</span>
          <span class="tt-label">Stop</span><span class="tt-val bear">${s.stop.toFixed(2)}</span>
          <span class="tt-label">TP1</span><span class="tt-val">${s.tp1.toFixed(2)} <span class="tt-dim">(${rr1}R)</span></span>
          <span class="tt-label">TP2</span><span class="tt-val">${s.tp2.toFixed(2)}</span>
          <span class="tt-label">TP3</span><span class="tt-val">${s.tp3.toFixed(2)}</span>
          <span class="tt-label">Score</span><span class="tt-val gold">${s.score}/12</span>
        </div>
        <div class="tt-pills">${s.reasons.map(r=>`<span class="pill">${r}</span>`).join('')}</div>`;
    }
  }
  return '';
}

function positionTooltip(mx, my) {
  const tip = els.tooltip;
  const wrap = els.chartWrap.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let tx = mx + 16, ty = my + 16;
  if (tx + tw > wrap.width - 8) tx = mx - tw - 16;
  if (ty + th > wrap.height - 8) ty = my - th - 16;
  tx = Math.max(8, tx); ty = Math.max(8, ty);
  tip.style.left = `${tx}px`;
  tip.style.top  = `${ty}px`;
}

let lastData=null;

els.chart.addEventListener('mousemove', e => {
  const rect = els.chart.getBoundingClientRect();
  state.mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top, active: true };
  if (state.drag) {
    const barsPerPx = (state.layout ? (state.layout.end - state.layout.start) / state.layout.chartW : 0);
    const dx = e.clientX - state.drag.x;
    const wanted = state.drag.offset + dx * barsPerPx;
    const maxOff = Math.max(0, state.candles.length - state.window);
    state.offset = Math.round(Math.max(0, Math.min(maxOff, wanted)));
    if (lastData) renderChart(els.chart, lastData.candles, lastData.opts);
    return;
  }
  const hit = hitTest(state.mouse.x, state.mouse.y);
  state.hover = hit;
  if (hit) {
    els.tooltip.innerHTML = buildTooltipHtml(hit);
    els.tooltip.classList.remove('hidden');
    positionTooltip(state.mouse.x, state.mouse.y);
    els.chart.style.cursor = hit.type === 'signal' ? 'pointer' : 'crosshair';
  } else {
    els.tooltip.classList.add('hidden');
    els.chart.style.cursor = 'crosshair';
  }
  if (lastData) renderChart(els.chart, lastData.candles, lastData.opts);
});

els.chart.addEventListener('mouseleave', () => {
  state.mouse.active = false; state.hover = null; state.drag = null;
  els.tooltip.classList.add('hidden'); els.chart.style.cursor = 'crosshair';
  if (lastData) renderChart(els.chart, lastData.candles, lastData.opts);
});

els.chart.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  state.drag = { x: e.clientX, offset: state.offset };
  els.chart.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', () => {
  if (state.drag) { state.drag = null; els.chart.style.cursor = 'crosshair'; }
});

els.chart.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = els.chart.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const L = state.layout;
  if (!L) return;
  const dir = e.deltaY < 0 ? 1 : -1;
  const oldWindow = state.window;
  const newWindow = dir > 0 ? Math.max(20, Math.round(oldWindow / 1.25)) : Math.min(500, Math.round(oldWindow * 1.25));
  if (newWindow === oldWindow) return;
  const idxUnderCursor = L.idxFromPx(mx);
  const relPos = (idxUnderCursor - L.start) / Math.max(1, L.end - L.start);
  const newStart = Math.max(0, Math.round(idxUnderCursor - relPos * newWindow));
  const newEnd = Math.min(state.candles.length, newStart + newWindow);
  state.window = newWindow;
  state.offset = Math.max(0, state.candles.length - newEnd);
  if (lastData) { state.opts.defaultWindow = state.window; renderChart(els.chart, lastData.candles, lastData.opts); }
}, { passive: false });

els.chart.addEventListener('dblclick', () => {
  state.window = state.opts?.defaultWindow || 100;
  state.offset = 0;
  if (lastData) renderChart(els.chart, lastData.candles, lastData.opts);
});
els.resetBtn.addEventListener('click', () => {
  state.window = state.opts?.defaultWindow || 100;
  state.offset = 0;
  if (lastData) renderChart(els.chart, lastData.candles, lastData.opts);
});

async function runAnalysis(){
  const interval   = els.interval.value;
  const outputsize = Math.max(100, parseInt(els.outputsize.value,10)||500);
  const windowVal  = Math.max(20,  parseInt(els.window.value,10)||100);
  const htfRatio   = Math.max(2,   parseInt(els.htfRatio.value,10)||5);
  const minScore   = Math.max(0,   parseInt(els.minScore.value,10)||6);

  els.fetchBtn.disabled=true;
  setStatus(`Fetching ${outputsize} × ${interval} candles…`, 'info', true);

  try {
    const url = `/api/analyze?interval=${encodeURIComponent(interval)}`
              + `&outputsize=${outputsize}&htf_ratio=${htfRatio}&min_score=${minScore}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);

    state.candles = data.candles;
    state.window  = windowVal;
    state.offset  = 0;
    state.opts = {
      interval, defaultWindow: windowVal,
      zones: data.zones, fvgs: data.fvgs, ifvgs: data.ifvgs,
      structures: data.structures, sweeps: data.sweeps, signals: data.signals,
    };
    state.hover = null;
    state.mouse = { x: -1, y: -1, active: false };

    lastData = { candles: data.candles, opts: state.opts };

    renderChart(els.chart, data.candles, state.opts);
    updateBias(data.bias);
    renderSignals(data.signals, minScore);

    setStatus(`✔ Done — ${data.signals.length} signal${data.signals.length===1?'':'s'} on ${data.symbol} ${data.interval}.`, 'success');
  } catch (e){
    console.error(e);
    if (e instanceof TypeError && String(e.message).includes('fetch')) {
      setStatus('✖ Cannot reach the Aurum server. Run `cargo run --bin aurum-web` and open http://localhost:3000', 'error');
    } else {
      setStatus(`✖ ${e.message || e}`, 'error');
    }
  } finally {
    els.fetchBtn.disabled = false;
  }
}

els.fetchBtn.addEventListener('click', runAnalysis);
requestAnimationFrame(() => drawPlaceholder(els.chart, 'Click Fetch & Analyze to start'));
new ResizeObserver(() => {
  if (lastData) renderChart(els.chart, lastData.candles, lastData.opts);
  else drawPlaceholder(els.chart, 'Click Fetch & Analyze to start');
}).observe(els.chart);
</script>
</body>
</html>
